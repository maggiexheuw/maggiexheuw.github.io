layout: page
title: "About"
description: "Maggie Xheuw's Blog."

<style>
:root{
 --paper:#fbfaf5;
 --card:#fffdf8;
 --ink:#17211f;
 --muted:#68736d;
 --green:#214b42;
 --gold:#b08a48;
 --line:rgba(23,33,31,.12);
 --shadow:0 25px 70px rgba(20,30,28,.12);
 --serif:"Cormorant Garamond",Georgia,serif;
 --sans:"Inter",Arial,sans-serif;
}
.about-wrapper{
 max-width:1000px;margin:auto;padding:30px;
}
.about-card{
 background:linear-gradient(145deg,#fffdf8,#f6f1e6);
 border-radius:36px;
 padding:70px 80px;
 box-shadow:var(--shadow);
 border:1px solid var(--line);
 font-family:var(--serif);
 font-size:1.45rem;
 line-height:1.95;
 color:var(--ink);
}
.about-card:before{
 content:"";
 display:block;
 height:6px;
 width:120px;
 background:linear-gradient(90deg,var(--gold),var(--green));
 border-radius:10px;
 margin-bottom:40px;
}
.about-card h5{
 font-family:var(--sans);
 font-size:2rem;
 color:var(--green);
 border-bottom:1px solid var(--line);
 padding-bottom:15px;
 margin-top:55px;
}
.about-card blockquote{
 background:#f1eee5;
 border-left:8px solid var(--gold);
 padding:20px 30px;
 border-radius:0 20px 20px 0;
 font-size:2rem;
 font-style:italic;
 color:var(--green);
}
.social-links a{
 display:inline-block;
 padding:10px 22px;
 margin:8px;
 border-radius:50px;
 background:#eee8d8;
 color:var(--green);
 text-decoration:none;
 font-family:var(--sans);
 font-weight:600;
 transition:.3s;
}
.social-links a:hover{
 background:var(--green);
 color:white;
 transform:translateY(-4px);
}
.pub-item{
 background:white;
 padding:30px;
 border-radius:24px;
 border-left:8px solid var(--gold);
 box-shadow:0 12px 35px rgba(0,0,0,.06);
 margin:25px 0;
}
.pub-title{
 font-size:1.7rem;
 color:var(--green);
 font-weight:700;
}
.pub-authors,.pub-journal{
 color:var(--muted);
}
@media(max-width:700px){
 .about-card{padding:35px 25px;font-size:1.2rem}
}
</style>

<div class="about-wrapper"><div class="about-card">
<blockquote>“There's plenty of room at the bottom.” – Richard Feynman</blockquote>
{{ content }}
</div></div>
